<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Soft Shadow for depth -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Arc (The "Swoosh") -->
  <path d="M60 210C60 270 140 320 200 320C260 320 340 270 340 210" 
        stroke="#22D3EE" 
        stroke-width="18" 
        stroke-linecap="round" 
        fill="none" />

  <!-- Main Shield Body -->
  <path d="M100 70C100 70 100 80 100 85C100 135 120 185 200 245C280 185 300 135 300 85C300 80 300 70 300 70L200 50L100 70Z" 
        fill="#1EABB2" 
        filter="url(#shadow)" />

  <!-- Inner Shield Detail (Matching the Image) -->
  <path d="M115 85C115 85 115 90 115 95C115 130 135 170 200 220C265 170 285 130 285 95C285 90 285 85 285 85L200 65L115 85Z" 
        fill="#0D7C82" />

  <!-- Medical Cross -->
  <rect x="185" y="110" width="30" height="80" rx="3" fill="white" />
  <rect x="160" y="135" width="80" height="30" rx="3" fill="white" />
</svg>